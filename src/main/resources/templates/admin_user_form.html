<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin-user-form.css}">
</head>

<body class="bg-dark text-light">

<div class="container mt-4" style="max-width: 600px;">

    <h2 class="text-center mb-4">Editar Usuario</h2>

    <form th:action="@{/admin/users/update}" method="post" th:object="${user}">

        <input type="hidden" th:field="*{id}">

        <!-- Usuario -->
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-control" th:field="*{username}">
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>

        <!-- Rol corregido -->
        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-control" th:field="*{role}">
                <option value="USER">Usuario</option>
                <option value="ADMIN">Administrador</option>
            </select>
        </div>

        <button class="btn btn-primary w-100">Guardar Cambios</button>

        <a href="/admin/users" class="btn btn-secondary w-100 mt-3">Volver</a>

    </form>

</div>

</body>
</html>
