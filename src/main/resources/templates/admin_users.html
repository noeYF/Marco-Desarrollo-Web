<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin-users.css}">
</head>

<body>

<div class="container mt-4">
    <h2 class="mb-4">Gestión de Usuarios</h2>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role}"></td>

            <td>
                <a th:href="@{'/admin/users/edit/' + ${u.id}}" class="btn btn-sm btn-primary">Editar</a>
                <a th:href="@{'/admin/users/delete/' + ${u.id}}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/admin" class="btn btn-secondary">Volver</a>
</div>

</body>
</html>
