<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-body">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="login-card col-md-4">

        <h2 class="text-center mb-4 login-title">🔐 Iniciar Sesión</h2>

        <div th:if="${param.error}" class="alert alert-danger text-center">
            Credenciales incorrectas
        </div>

        <div th:if="${param.success}" class="alert alert-success text-center">
            Registro exitoso, ahora ingresa
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input name="username" type="text" class="form-control login-input" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input name="password" type="password" class="form-control login-input" required>
            </div>

            <button class="btn login-btn w-100 mb-3">Ingresar</button>

            <div class="text-center">
                <a href="/register" class="login-link">¿No tienes cuenta? Regístrate</a>
            </div>
        </form>

    </div>
</div>

</body>
</html>
