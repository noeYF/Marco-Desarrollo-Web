<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin-product-form.css}">
</head>

<body>

<div class="container mt-5" style="max-width: 650px;">

    <div class="form-card shadow-lg rounded-4 p-4">

        <h2 class="text-center mb-4 title"
            th:text="${product.id == null} ? '➕ Registrar Producto' : '✏ Editar Producto'"></h2>

        <form th:action="${product.id == null} ? @{/admin/products/save} : @{/admin/products/update}"
              th:object="${product}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control input-pro" th:field="*{name}" required>
            </div>

            <!-- Descripción -->
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control input-pro" th:field="*{description}" rows="3"></textarea>
            </div>

            <!-- Precio -->
            <div class="mb-3">
                <label class="form-label">Precio (S/)</label>
                <input type="number" step="0.01" class="form-control input-pro" th:field="*{price}" required>
            </div>

            <!-- Categoría -->
            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select class="form-control input-pro" th:field="*{category}" required>
                    <option value="">Seleccione una categoría</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <!-- Botones -->
            <button class="btn btn-save w-100">💾 Guardar</button>
            <a href="/admin/products" class="btn btn-back w-100 mt-3">⬅ Volver</a>

        </form>

    </div>

</div>

</body>
</html>
