<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Categoría</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/category-form.css}">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <div class="category-card">

        <h2 class="text-center mb-4">🗂️ Categoría</h2>

        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">

            <input type="hidden" th:field="*{id}"/>

            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{name}" class="form-control input-pro" required>
            </div>

            <button class="btn-submit w-100">Guardar</button>

            <a href="/admin/categories" class="btn-back w-100 mt-3 text-center d-block">
                ← Volver
            </a>

        </form>

    </div>

</div>

</body>
</html>
