<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Panel</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #121212;
            color: #e4e4e4;
        }

        .title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .card-option {
            background: #1e1e1e;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            transition: all .25s ease;
        }

        .card-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .card-option i {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card-option h5 {
            margin-top: 10px;
            font-weight: 600;
        }
    </style>

</head>

<body>

<div class="container mt-5">

    <h2 class="title">👤 Mi Panel de Usuario</h2>

    <div class="row g-4">

        <!-- Mis tareas -->
        <div class="col-md-4">
            <a href="/tasks" class="text-decoration-none text-light">
                <div class="card-option">
                    <i class="bi bi-card-checklist text-warning"></i>
                    <h5>Mis Tareas</h5>
                </div>
            </a>
        </div>

        <!-- Carrito -->
        <div class="col-md-4">
            <a href="/cart" class="text-decoration-none text-light">
                <div class="card-option">
                    <i class="bi bi-cart-check text-success"></i>
                    <h5>Mi Carrito</h5>
                </div>
            </a>
        </div>

        <!-- Mis órdenes -->
        <div class="col-md-4">
            <a href="/orders" class="text-decoration-none text-light">
                <div class="card-option">
                    <i class="bi bi-box-seam text-info"></i>
                    <h5>Mis Órdenes</h5>
                </div>
            </a>
        </div>

        <!-- Ver productos -->
        <div class="col-md-4">
            <a href="/products" class="text-decoration-none text-light">
                <div class="card-option">
                    <i class="bi bi-shop text-primary"></i>
                    <h5>Ver Productos</h5>
                </div>
            </a>
        </div>

        <!-- Perfil (opcional) -->
        <div class="col-md-4">
            <a href="#" class="text-decoration-none text-light">
                <div class="card-option">
                    <i class="bi bi-person-circle text-light"></i>
                    <h5>Mi Perfil</h5>
                </div>
            </a>
        </div>

        <!-- Logout -->
        <div class="col-md-4">
            <a href="/logout" class="text-decoration-none text-light">
                <div class="card-option">
                    <i class="bi bi-box-arrow-right text-danger"></i>
                    <h5>Cerrar Sesión</h5>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
